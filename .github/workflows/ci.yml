name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ccs-herdr
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  python:
    # ccs 引擎基于 Windows ConPTY，只在 Windows 上做语法/冒烟检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile ccs-tool/ccs.py ccs-tool/ccs_agents.py ccs-tool/ccs_bus.py ccs-tool/ccs_mcp.py ccs-tool/ccs_web.py
      - name: Smoke test
        shell: bash
        run: |
          export CCS_HOME="$PWD/.ci-ccs-home"
          python ccs-tool/ccs.py version
